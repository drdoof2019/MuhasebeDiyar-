{% extends "base.html" %}
{% block title %}Kullanıcı Oluştur - MuhasebeDiyarı{% endblock %}
{% block page_title %}Yeni Kullanıcı Oluştur{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Kullanıcı Adı</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="full_name" class="form-label">Ad Soyad</label>
                        <input type="text" class="form-control" id="full_name" name="full_name" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Şifre</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-4">
                        <label for="password_confirm" class="form-label">Şifre (Tekrar)</label>
                        <input type="password" class="form-control" id="password_confirm" name="password_confirm" required>
                    </div>

                    <h6 class="mb-3">Yetkiler</h6>
                    <p class="text-muted small mb-3">Tüm yetkileri işaretlerseniz kullanıcı <strong>yönetici</strong> olur.</p>
                    <div class="row g-2 mb-4">
                        <div class="col-md-6">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="can_view_transactions" name="can_view_transactions" checked>
                                <label class="form-check-label" for="can_view_transactions">İşlemleri Görüntüleme</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="can_add_transaction" name="can_add_transaction">
                                <label class="form-check-label" for="can_add_transaction">İşlem Ekleme</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="can_edit_transaction" name="can_edit_transaction">
                                <label class="form-check-label" for="can_edit_transaction">İşlem Düzenleme</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="can_delete_transaction" name="can_delete_transaction">
                                <label class="form-check-label" for="can_delete_transaction">İşlem Silme</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="can_view_reports" name="can_view_reports" checked>
                                <label class="form-check-label" for="can_view_reports">Raporları Görüntüleme</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="can_manage_users" name="can_manage_users">
                                <label class="form-check-label" for="can_manage_users">Kullanıcı Yönetimi</label>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Oluştur</button>
                        <a href="{{ url_for('users.list') }}" class="btn btn-outline-secondary"><i class="bi bi-x-circle me-1"></i> İptal</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
